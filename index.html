<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock de Materiales - Taller</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:#f0f2f5;color:#333}
header{background:#1a5276;color:#fff;padding:13px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
header h1{font-size:1.15rem;font-weight:600;flex:1}
#syncStatus{font-size:.76rem;white-space:nowrap;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.15)}
#syncStatus.ok{background:rgba(39,174,96,.35)}
#syncStatus.err{background:rgba(231,76,60,.45)}
#syncStatus.busy{background:rgba(243,156,18,.35)}
#cfgBar{background:#154360;padding:9px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#cfgBar label{color:#aed6f1;font-size:.77rem;white-space:nowrap}
#cfgBar input{padding:5px 9px;border-radius:5px;border:none;font-size:.82rem}
#cfgBar input[type=password]{width:230px;letter-spacing:2px}
#cfgBar input[type=text]{width:200px}
.btn-sm{padding:5px 13px;border:none;border-radius:5px;font-size:.8rem;cursor:pointer;color:#fff;background:#2471a3}
.btn-sm:hover{background:#1a5276}
.toolbar{background:#fff;padding:11px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dde;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.sw{position:relative;flex:1;min-width:180px;max-width:400px}
.sw input{width:100%;padding:7px 30px 7px 10px;border:1px solid #c5cae9;border-radius:6px;font-size:.9rem;outline:none}
.sw input:focus{border-color:#1a5276}
.sw .xb{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:.95rem;display:none}
.sw input:not(:placeholder-shown)+.xb{display:block}
.ftog{display:flex;border:1px solid #c5cae9;border-radius:6px;overflow:hidden}
.ftog label{padding:6px 12px;font-size:.8rem;cursor:pointer;background:#fff;color:#555;user-select:none}
.ftog input[type=radio]{display:none}
.ftog input:checked+label{background:#1a5276;color:#fff}
.cnt{font-size:.78rem;color:#777;white-space:nowrap}
.tb-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%}
.tb-filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1}
.tb-acciones{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-left:auto}
#ubicFiltro{padding:6px 8px;border:1px solid #c5cae9;border-radius:6px;font-size:.82rem;outline:none;background:#fff;cursor:pointer}
.btn{padding:6px 13px;border:none;border-radius:6px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:5px;color:#fff;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-nuevo{background:#2471a3}.btn-nuevo:hover:not(:disabled){background:#1a5276}
.btn-export{background:#1e8449}.btn-export:hover:not(:disabled){background:#196f3d}
.btn-import{background:#6c3483}.btn-import:hover{background:#5b2c6f}
.btn-reset{background:#e74c3c}.btn-reset:hover:not(:disabled){background:#c0392b}
#mapaBtn{padding:6px 13px;background:#7d6608;border:none;border-radius:6px;font-size:.8rem;cursor:pointer;color:#fff;display:flex;align-items:center;gap:5px}
#mapaBtn:hover{background:#6e5b07}
.twrap{padding:13px 20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
thead tr{background:#1a5276;color:#fff}
thead th{padding:9px 12px;text-align:left;font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
tbody tr{border-bottom:1px solid #eef;transition:background .1s}
tbody tr:hover{background:#f5f8ff}
tbody tr.nuevo-row{background:#eafaf1}
td{padding:7px 12px;font-size:.87rem;vertical-align:middle}
.tnro{font-weight:600;color:#1a5276;white-space:nowrap}
.tstock{text-align:center;font-weight:600;color:#27ae60}
.tumb{text-align:center;color:#aaa;font-size:.77rem}
.tinput input{width:82px;padding:5px 6px;border:1px solid #c5cae9;border-radius:5px;font-size:.86rem;text-align:center;outline:none}
.tinput input:focus{border-color:#1a5276}
.tubic select{padding:4px 6px;border:1px solid #c5cae9;border-radius:5px;font-size:.82rem;outline:none;background:#fff;cursor:pointer;min-width:72px}
.tubic select:focus{border-color:#1a5276}
.tubic select.asignado{border-color:#27ae60;color:#1e8449;font-weight:600}
.trest{text-align:center;font-weight:700;font-size:.9rem}
.rok{color:#27ae60}.rwarn{color:#e67e22}.rneg{color:#e74c3c}.remp{color:#ccc}
mark{background:#fff176;border-radius:2px;padding:0 1px}
.msgc{text-align:center;padding:50px 20px;color:#999}
.msgc .ic{font-size:2rem;margin-bottom:8px}
.sinfo{text-align:center;padding:5px 0 2px;font-size:.77rem;color:#aaa}
.lmwrap{text-align:center;padding:10px 0 4px}
.btnlm{padding:7px 24px;background:#1a5276;color:#fff;border:none;border-radius:6px;font-size:.83rem;cursor:pointer}
.btnlm:hover{background:#154360}
footer{text-align:center;padding:13px;font-size:.73rem;color:#bbb}
.ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.ov.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:24px 28px;width:390px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal h2{font-size:.98rem;color:#1a5276;margin-bottom:16px}
.modal label{display:block;font-size:.78rem;color:#555;margin:11px 0 3px;font-weight:600}
.modal input,.modal select{width:100%;padding:7px 9px;border:1px solid #c5cae9;border-radius:5px;font-size:.88rem;outline:none}
.modal input:focus,.modal select:focus{border-color:#1a5276}
.merr{color:#e74c3c;font-size:.78rem;margin-top:6px;display:none}
.mbtns{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}
.bconf{padding:7px 18px;background:#1e8449;color:#fff;border:none;border-radius:6px;font-size:.83rem;cursor:pointer}
.bconf:hover{background:#196f3d}
.bcanc{padding:7px 14px;background:#eee;color:#555;border:none;border-radius:6px;font-size:.83rem;cursor:pointer}
.bcanc:hover{background:#ddd}
.mapa-ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:1000;align-items:flex-start;justify-content:center;padding-top:40px;overflow-y:auto}
.mapa-ov.open{display:flex}
.mapa-box{background:#fff;border-radius:10px;padding:22px 26px;max-width:98vw;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.mapa-box h2{font-size:1rem;color:#1a5276;margin-bottom:16px}
.mapa-grid{display:flex;gap:14px;flex-wrap:wrap}
.cajon-col{background:#f8f9fa;border:1px solid #dde;border-radius:8px;padding:10px 14px;min-width:130px}
.cajon-col h3{font-size:.8rem;color:#1a5276;font-weight:700;margin-bottom:8px;text-align:center;background:#d6eaf8;border-radius:4px;padding:3px}
.cajon-slot{padding:4px 6px;margin:3px 0;border-radius:5px;font-size:.78rem;min-height:28px;border:1px solid #e0e0e0;background:#fff}
.cajon-slot.ocupado{background:#d5f5e3;border-color:#27ae60}
.cajon-slot .slot-nro{font-weight:600;color:#1a5276;font-size:.75rem}
.cajon-slot .slot-txt{color:#555;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.cajon-slot.vacio{color:#ccc;font-size:.73rem;text-align:center}
.mapa-close{margin-top:16px;text-align:right}
#toast{position:fixed;bottom:22px;right:22px;background:#1a5276;color:#fff;padding:9px 16px;border-radius:8px;font-size:.83rem;opacity:0;transition:opacity .3s;z-index:2000;pointer-events:none}
#toast.show{opacity:1}
#toast.terr{background:#e74c3c}
</style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 7H8v2h6v2H8v2h6v2H6V7h8v3z"/></svg>
  <h1>Stock de Materiales &mdash; Taller</h1>
  <span id="syncStatus">&#x25CC; sin configurar</span>
</header>

<div id="cfgBar">
  <label>Token GitHub:</label>
  <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
  <label>Repo:</label>
  <input type="text" id="cfgRepo" placeholder="usuario/repo" value="swisss33sss-max/Materiales">
  <button class="btn-sm" onclick="guardarConfig()">&#x2714; Conectar</button>
  <button class="btn-sm" id="btnOcultarCfg" onclick="toggleCfg()" style="display:none;background:#555">Ocultar</button>
</div>

<div class="toolbar">
  <div class="tb-row">
    <div class="tb-filtros">
      <div class="sw">
        <input type="text" id="busq" placeholder="Buscar por numero, descripcion o ubicacion..." autocomplete="off">
        <button class="xb" onclick="clearSearch()">&#x2715;</button>
      </div>
      <div class="ftog">
        <input type="radio" name="fil" id="f-todos" value="todos" checked><label for="f-todos">Todos</label>
        <input type="radio" name="fil" id="f-stock" value="stock"><label for="f-stock">Con stock</label>
        <input type="radio" name="fil" id="f-fisico" value="fisico"><label for="f-fisico">Ingresados</label>
        <input type="radio" name="fil" id="f-ubic" value="ubic"><label for="f-ubic">Con ubicacion</label>
      </div>
      <select id="ubicFiltro" onchange="aplicarFiltros()" style="display:none">
        <option value="">Todas las columnas</option>
      </select>
      <span class="cnt" id="cntBadge">&mdash;</span>
    </div>
    <div class="tb-acciones">
      <button class="btn btn-nuevo" onclick="abrirModal()">&#x2795; Nuevo</button>
      <button class="btn btn-export" id="btnExp" onclick="exportarExcel()">&#x2193; Excel</button>
      <label class="btn btn-import" title="Importar Excel exportado por esta app">&#x2191; Importar<input type="file" id="fileImport" accept=".xlsx,.xls" style="display:none" onchange="importarExcel(this)"></label>
      <button class="btn btn-reset" onclick="resetAll()">&#x21BA; Limpiar</button>
    </div>
  </div>
</div>

<div class="twrap">
  <div class="msgc" id="loading"><div class="ic">&#x23F3;</div>Cargando...</div>
  <table id="tbl" style="display:none">
    <thead><tr>
      <th>N&deg; Material</th>
      <th style="text-align:center">Stock</th>
      <th style="text-align:center">UMB</th>
      <th>Descripcion</th>
      <th style="text-align:center">Cant. fisica</th>
      <th style="text-align:center">Ubicacion</th>
      <th style="text-align:center">Restantes</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="msgc" id="noRes" style="display:none"><div class="ic">&#x1F50D;</div>Sin resultados.</div>
</div>
<div class="sinfo" id="sinfo" style="display:none"></div>
<div class="lmwrap" id="lmwrap" style="display:none"><button class="btnlm" onclick="cargarMas()">Ver mas resultados</button></div>
<footer>Taller &middot; <span id="totCount">0</span> materiales &middot; <span id="lastSync">sin sincronizar</span></footer>

<!-- Modal generico (prompt / confirm con estilo) -->
<div class="ov" id="ovDlg">
  <div class="modal">
    <h2 id="dlgTitulo"></h2>
    <p id="dlgMsg" style="font-size:.85rem;color:#555;margin-bottom:4px"></p>
    <input type="text" id="dlgInput" style="display:none" autocomplete="off">
    <div class="merr" id="dlgErr"></div>
    <div class="mbtns">
      <button class="bcanc" id="dlgCanc">Cancelar</button>
      <button class="bconf" id="dlgOk">Aceptar</button>
    </div>
  </div>
</div>

<!-- Modal nuevo material -->
<div class="ov" id="ovNuevo">
  <div class="modal">
    <h2>&#x2795; Nuevo material</h2>
    <label>N&deg; Material *</label><input type="text" id="mnro" placeholder="Ej: 9999999">
    <label>Descripcion *</label><input type="text" id="mtexto" placeholder="Ej: CABLE XYZ">
    <label>Stock inicial</label><input type="number" id="mstock" value="0" min="0">
    <label>UMB</label><input type="text" id="mumb" value="UN">
    <label>Ubicacion en cajon</label>
    <select id="mubic"><option value="">-- Sin ubicacion --</option></select>
    <div class="merr" id="merr"></div>
    <div class="mbtns">
      <button class="bcanc" onclick="cerrarModal('ovNuevo')">Cancelar</button>
      <button class="bconf" onclick="confirmarNuevo()">Agregar</button>
    </div>
  </div>
</div>

<!-- Mapa cajones -->
<div class="mapa-ov" id="ovMapa">
  <div class="mapa-box">
    <h2>&#x1F4E6; Mapa de cajones</h2>
    <div class="mapa-grid" id="mapaGrid"></div>
    <div class="mapa-close"><button class="bcanc" onclick="cerrarModal('ovMapa')">Cerrar</button></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
// ═══════════════════════════════════════
// CAJONES A-H / 1-5
// ═══════════════════════════════════════
var COLS=['A','B','C','D','E','F','G','H'];
var ROWS=[1,2,3,4,5,6];
var UBICACIONES=[];
COLS.forEach(function(c){ROWS.forEach(function(r){UBICACIONES.push(c+r);});});

function llenarSelectUbic(id,val){
  var s=document.getElementById(id);
  if(!s)return;
  s.innerHTML='<option value="">-- Sin ubicacion --</option>';
  UBICACIONES.forEach(function(u){
    var o=document.createElement('option');
    o.value=u;o.textContent=u;
    if(u===val)o.selected=true;
    s.appendChild(o);
  });
}

// ═══════════════════════════════════════
// GITHUB API
// ═══════════════════════════════════════
var REPO='',TOKEN='',DB_PATH='db.json',BRANCH='main',dbSHA='';
var db=null,saveTimer=null,SAVE_DELAY=1800;
var CFG_KEY='gh_mat_v2';

function apiHdr(){return{'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};}

function guardarConfig(){
  TOKEN=document.getElementById('cfgToken').value.trim();
  REPO=document.getElementById('cfgRepo').value.trim();
  if(!TOKEN||!REPO){toast('Ingresa token y repo',1);return;}
  localStorage.setItem(CFG_KEY,JSON.stringify({token:TOKEN,repo:REPO}));
  document.getElementById('btnOcultarCfg').style.display='';
  setSS('busy','Conectando...');
  cargarDB();
}
function cargarConfig(){
  var raw=localStorage.getItem(CFG_KEY);
  if(!raw)return false;
  var c=JSON.parse(raw);TOKEN=c.token||'';REPO=c.repo||'';
  document.getElementById('cfgToken').value=TOKEN;
  document.getElementById('cfgRepo').value=REPO;
  document.getElementById('btnOcultarCfg').style.display=TOKEN?'':'none';
  return !!(TOKEN&&REPO);
}
function toggleCfg(){var p=document.getElementById('cfgBar');p.style.display=p.style.display==='none'?'':'none';}

function cargarDB(){
  setSS('busy','Cargando...');
  fetch('https://api.github.com/repos/'+REPO+'/contents/'+DB_PATH+'?ref='+BRANCH+'&t='+Date.now(),{headers:apiHdr()})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){
      dbSHA=data.sha;
      var raw=atob(data.content.replace(/\n/g,''));
      var bytes=new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      db=JSON.parse(new TextDecoder('utf-8').decode(bytes));
      if(!db.fisicos)db.fisicos={};
      if(!db.ubicaciones)db.ubicaciones={};
      if(!db.nuevos)db.nuevos=[];
      iniciarApp();
      setSS('ok','Sincronizado');
      document.getElementById('lastSync').textContent='Sincronizado '+hora();
    })
    .catch(function(e){
      setSS('err','Error');
      toast('No se pudo cargar db.json: '+e.message,1);
      document.getElementById('loading').innerHTML='<div class="ic">&#x26A0;&#xFE0F;</div>Verifica token y repo.';
    });
}

function saveDB(){
  if(!TOKEN||!REPO||!db)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushDB,SAVE_DELAY);
}
function pushDB(){
  setSS('busy','Guardando...');
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(db))));
  fetch('https://api.github.com/repos/'+REPO+'/contents/'+DB_PATH,{
    method:'PUT',headers:apiHdr(),
    body:JSON.stringify({message:'update '+hora(),content:content,sha:dbSHA,branch:BRANCH})
  })
  .then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.message);});return r.json();})
  .then(function(d){dbSHA=d.content.sha;setSS('ok','Guardado');document.getElementById('lastSync').textContent='Guardado '+hora();})
  .catch(function(e){setSS('err','Error al guardar');toast('Error: '+e.message,1);});
}

// ═══════════════════════════════════════
// APP
// ═══════════════════════════════════════
var allData=[],filtrados=[],PAGE=100,pag=0;

function iniciarApp(){
  allData=db.materiales.map(function(d){
    return{nro:String(d.nro||'').trim(),stock:parseFloat(d.stock)||0,umb:String(d.umb||'').trim(),texto:String(d.texto||'').trim(),esNuevo:false};
  });
  (db.nuevos||[]).forEach(function(d){
    allData.push({nro:String(d.nro||'').trim(),stock:parseFloat(d.stock)||0,umb:String(d.umb||'').trim(),texto:String(d.texto||'').trim(),esNuevo:true});
  });
  document.getElementById('totCount').textContent=allData.length.toLocaleString('es-AR');
  document.getElementById('loading').style.display='none';
  llenarSelectUbic('mubic','');
  var uf=document.getElementById('ubicFiltro');
  uf.innerHTML='<option value="">Todas las columnas</option>';
  COLS.forEach(function(c){uf.innerHTML+='<option value="'+c+'">Columna '+c+'</option>';});
  aplicarFiltros();
  document.getElementById('busq').addEventListener('input',aplicarFiltros);
  document.querySelectorAll('input[name=fil]').forEach(function(r){r.addEventListener('change',aplicarFiltros);});
}

function aplicarFiltros(){
  var q=document.getElementById('busq').value.trim().toLowerCase();
  var f=document.querySelector('input[name=fil]:checked').value;
  var ubicSel=document.getElementById('ubicFiltro');
  ubicSel.style.display=f==='ubic'?'':'none';
  if(f!=='ubic')ubicSel.value='';
  var ubicF=ubicSel.value;
  filtrados=allData.filter(function(m){
    if(f==='stock'&&m.stock<=0)return false;
    if(f==='fisico'&&db.fisicos[m.nro]===undefined)return false;
    if(f==='ubic'&&!db.ubicaciones[m.nro])return false;
    if(f==='ubic'&&ubicF&&(db.ubicaciones[m.nro]||'').charAt(0)!==ubicF)return false;
    if(q){
      var u=(db.ubicaciones[m.nro]||'').toLowerCase();
      if(!m.nro.toLowerCase().includes(q)&&!m.texto.toLowerCase().includes(q)&&!u.includes(q))return false;
    }
    return true;
  });
  document.getElementById('cntBadge').textContent=filtrados.length.toLocaleString('es-AR')+' resultado'+(filtrados.length!==1?'s':'');
  pag=0;document.getElementById('tbody').innerHTML='';
  renderPag(q);
}

function cargarMas(){pag++;renderPag(document.getElementById('busq').value.trim().toLowerCase());}

function renderPag(q){
  var tbody=document.getElementById('tbody');
  var tbl=document.getElementById('tbl');
  var noRes=document.getElementById('noRes');
  var sinfo=document.getElementById('sinfo');
  var lmwrap=document.getElementById('lmwrap');
  if(filtrados.length===0){tbl.style.display='none';noRes.style.display='block';sinfo.style.display='none';lmwrap.style.display='none';return;}
  noRes.style.display='none';tbl.style.display='';
  var desde=pag*PAGE,hasta=Math.min(desde+PAGE,filtrados.length);
  var slice=filtrados.slice(desde,hasta);
  sinfo.style.display='block';
  sinfo.textContent='Mostrando '+hasta.toLocaleString('es-AR')+' de '+filtrados.length.toLocaleString('es-AR')+' resultados';
  lmwrap.style.display=hasta<filtrados.length?'block':'none';
  var html='';
  for(var i=0;i<slice.length;i++){
    var m=slice[i];
    var fis=db.fisicos[m.nro]!==undefined?db.fisicos[m.nro]:'';
    var ubic=db.ubicaciones[m.nro]||'';
    var rv=fis!==''?m.stock-parseFloat(fis):null;
    var rh,rc;
    if(rv===null){rh='&mdash;';rc='remp';}
    else if(rv<0){rh=rv.toLocaleString('es-AR');rc='rneg';}
    else if(rv===0){rh='0';rc='rwarn';}
    else{rh=rv.toLocaleString('es-AR');rc='rok';}
    var opts='<option value="">-</option>';
    for(var u=0;u<UBICACIONES.length;u++){opts+='<option value="'+UBICACIONES[u]+'"'+(UBICACIONES[u]===ubic?' selected':'')+'>'+UBICACIONES[u]+'</option>';}
    html+='<tr'+(m.esNuevo?' class="nuevo-row"':'')+'>'
      +'<td class="tnro">'+hl(m.nro,q)+'</td>'
      +'<td class="tstock">'+m.stock.toLocaleString('es-AR')+'</td>'
      +'<td class="tumb">'+esc(m.umb)+'</td>'
      +'<td>'+hl(m.texto,q)+'</td>'
      +'<td class="tinput"><input type="number" min="0" step="1" value="'+esc(String(fis))+'" placeholder="0" data-nro="'+esc(m.nro)+'" onchange="actFisico(this)" oninput="actFisico(this)"></td>'
      +'<td class="tubic"><select data-nro="'+esc(m.nro)+'" onchange="actUbic(this)"'+(ubic?' class="asignado"':'')+'>'+opts+'</select></td>'
      +'<td class="trest '+rc+'">'+rh+'</td>'
      +'</tr>';
  }
  tbody.innerHTML+=html;
}

function actFisico(inp){
  if(!db)return;
  var nro=inp.dataset.nro,val=inp.value.trim();
  if(val===''||isNaN(parseFloat(val)))delete db.fisicos[nro];
  else db.fisicos[nro]=parseFloat(val);
  var tr=inp.closest('tr'),tdR=tr.querySelector('.trest');
  var m=allData.find(function(x){return x.nro===nro;});
  if(m&&tdR){
    var fis=db.fisicos[nro];
    if(fis===undefined){tdR.innerHTML='&mdash;';tdR.className='trest remp';}
    else{var r=m.stock-fis;tdR.textContent=r.toLocaleString('es-AR');tdR.className='trest '+(r<0?'rneg':r===0?'rwarn':'rok');}
  }
  saveDB();
}

function actUbic(sel){
  if(!db)return;
  var nro=sel.dataset.nro,val=sel.value;
  if(val)db.ubicaciones[nro]=val;
  else delete db.ubicaciones[nro];
  sel.className=val?'asignado':'';
  saveDB();
  toast(val?'Ubicacion '+val+' asignada':'Ubicacion removida');
}

// ═══════════════════════════════════════
// MAPA CAJONES
// ═══════════════════════════════════════
function abrirMapa(){
  var grid=document.getElementById('mapaGrid');
  grid.innerHTML='';
  var mapa={};
  COLS.forEach(function(c){ROWS.forEach(function(r){mapa[c+r]=[];});});
  Object.keys(db.ubicaciones).forEach(function(nro){
    var u=db.ubicaciones[nro];
    if(mapa[u])mapa[u].push(nro);
  });
  COLS.forEach(function(c){
    var col=document.createElement('div');
    col.className='cajon-col';
    col.innerHTML='<h3>Columna '+c+'</h3>';
    ROWS.forEach(function(r){
      var slot=document.createElement('div');
      var key=c+r,items=mapa[key];
      if(items&&items.length>0){
        slot.className='cajon-slot ocupado';
        items.forEach(function(nro){
          var mat=allData.find(function(x){return x.nro===nro;});
          slot.innerHTML+='<div class="slot-nro">'+key+' &bull; '+esc(nro)+'</div><div class="slot-txt">'+esc(mat?mat.texto:'?')+'</div>';
        });
      }else{slot.className='cajon-slot vacio';slot.textContent=key+' (libre)';}
      col.appendChild(slot);
    });
    grid.appendChild(col);
  });
  document.getElementById('ovMapa').classList.add('open');
}

// ═══════════════════════════════════════
// NUEVO MATERIAL
// ═══════════════════════════════════════
function abrirModal(){
  document.getElementById('mnro').value='';
  document.getElementById('mtexto').value='';
  document.getElementById('mstock').value='0';
  document.getElementById('mumb').value='UN';
  llenarSelectUbic('mubic','');
  document.getElementById('merr').style.display='none';
  document.getElementById('ovNuevo').classList.add('open');
  setTimeout(function(){document.getElementById('mnro').focus();},80);
}
function cerrarModal(id){document.getElementById(id).classList.remove('open');}
function confirmarNuevo(){
  var nro=document.getElementById('mnro').value.trim();
  var texto=document.getElementById('mtexto').value.trim();
  var stock=parseFloat(document.getElementById('mstock').value)||0;
  var umb=document.getElementById('mumb').value.trim()||'UN';
  var ubic=document.getElementById('mubic').value;
  var err=document.getElementById('merr');
  if(!nro){err.textContent='El N° es obligatorio.';err.style.display='block';return;}
  if(!texto){err.textContent='La descripcion es obligatoria.';err.style.display='block';return;}
  if(allData.find(function(m){return m.nro===nro;})){err.textContent='Ese numero ya existe.';err.style.display='block';return;}
  db.nuevos.push({nro:nro,stock:stock,umb:umb,texto:texto});
  allData.push({nro:nro,stock:stock,umb:umb,texto:texto,esNuevo:true});
  if(ubic)db.ubicaciones[nro]=ubic;
  document.getElementById('totCount').textContent=allData.length.toLocaleString('es-AR');
  cerrarModal('ovNuevo');
  aplicarFiltros();
  saveDB();
  toast('Material '+nro+' agregado');
  setTimeout(function(){
    var inp=document.querySelector('input[data-nro="'+nro+'"]');
    if(inp){inp.scrollIntoView({behavior:'smooth',block:'center'});inp.focus();}
  },200);
}

// ═══════════════════════════════════════
// IMPORTAR EXCEL
// ═══════════════════════════════════════
function importarExcel(input){
  if(!input.files||!input.files[0])return;
  if(!db){toast('Primero conectate a GitHub',1);input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){toast('El archivo no tiene datos',1);input.value='';return;}
      var hdr=rows[0].map(function(h){return String(h).trim().toLowerCase();});
      var iNro  =hdr.findIndex(function(h){return h==='material'||h.includes('material');});
      var iFis  =hdr.findIndex(function(h){return h.includes('cant')||h.includes('fisic');});
      var iUbic =hdr.findIndex(function(h){return h.includes('ubicac');});
      var iStock=hdr.findIndex(function(h){return h.includes('stock');});
      var iUmb  =hdr.findIndex(function(h){return h==='umb';});
      var iTexto=hdr.findIndex(function(h){return h.includes('texto')||h.includes('descrip');});
      if(iNro===-1){toast('No se encontro columna Material',1);input.value='';return;}
      var cF=0,cU=0,cN=0;
      for(var r=1;r<rows.length;r++){
        var row=rows[r];
        var nro=String(row[iNro]||'').trim();
        if(!nro)continue;
        var fis=iFis>=0?row[iFis]:'';
        var ubic=iUbic>=0?String(row[iUbic]||'').trim().toUpperCase():'';
        if(fis!==''&&fis!==null&&!isNaN(parseFloat(fis))){db.fisicos[nro]=parseFloat(fis);cF++;}
        if(ubic&&/^[A-H][1-6]$/.test(ubic)){db.ubicaciones[nro]=ubic;cU++;}
        if(!allData.find(function(m){return m.nro===nro;})){
          var st=iStock>=0?parseFloat(row[iStock])||0:0;
          var um=iUmb>=0?String(row[iUmb]||'UN').trim():'UN';
          var tx=iTexto>=0?String(row[iTexto]||'').trim():'';
          if(tx){db.nuevos.push({nro:nro,stock:st,umb:um,texto:tx});allData.push({nro:nro,stock:st,umb:um,texto:tx,esNuevo:true});cN++;}
        }
      }
      document.getElementById('totCount').textContent=allData.length.toLocaleString('es-AR');
      aplicarFiltros();
      saveDB();
      toast('Importado: '+cF+' cant.'+(cU?' / '+cU+' ubic.':'')+(cN?' / '+cN+' nuevos':''));
    }catch(err){toast('Error: '+err.message,1);}
    input.value='';
  };
  reader.onerror=function(){toast('No se pudo leer el archivo',1);input.value='';};
  reader.readAsArrayBuffer(input.files[0]);
}

// ═══════════════════════════════════════
// EXPORTAR EXCEL
// ═══════════════════════════════════════
function exportarExcel(){
  dlgPrompt('&#x2193; Exportar a Excel','Nombre del archivo (dejar vacio para el automatico):','','Ej: inventario_marzo').then(function(nombreUsr){
    if(nombreUsr===null)return;
    hacerExport(nombreUsr.trim());
  });
}
function hacerExport(nombreUsr){
  var btn=document.getElementById('btnExp');
  btn.disabled=true;
  setTimeout(function(){
    var wb=XLSX.utils.book_new();
    var lmap={todos:'Todos',stock:'ConStock',fisico:'Ingresados',ubic:'ConUbicacion'};
    var label=document.querySelector('input[name=fil]:checked').value;
    var rows=[['Material','Stock de cierre','UMB','Texto breve de material','Cant. fisica','Ubicacion','Restantes']];
    for(var i=0;i<filtrados.length;i++){
      var m=filtrados[i];
      var fis=db.fisicos[m.nro];
      var ubic=db.ubicaciones[m.nro]||'';
      var rest=fis!==undefined?m.stock-fis:'';
      rows.push([m.nro,m.stock,m.umb,m.texto,fis!==undefined?fis:'',ubic,rest]);
    }
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:16},{wch:6},{wch:46},{wch:12},{wch:10},{wch:12}];
    var hs={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1A5276'}},alignment:{horizontal:'center'}};
    ['A1','B1','C1','D1','E1','F1','G1'].forEach(function(r){if(ws[r])ws[r].s=hs;});
    XLSX.utils.book_append_sheet(wb,ws,'Materiales');
    var hoy=new Date();
    var f=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');
    var nombre;
    if(nombreUsr){
      nombre=nombreUsr.replace(/[\\/:*?"<>|]/g,'_');
      if(!/\.xlsx?$/i.test(nombre))nombre+='.xlsx';
    }else{
      nombre='Materiales_'+(lmap[label]||'Todos')+'_'+f+'.xlsx';
    }
    XLSX.writeFile(wb,nombre);
    btn.disabled=false;
  },50);
}

// ═══════════════════════════════════════
// MODAL GENERICO (prompt / confirm con estilo)
// ═══════════════════════════════════════
function dlgBase(opts){
  return new Promise(function(resolve){
    var ov=document.getElementById('ovDlg');
    var titulo=document.getElementById('dlgTitulo');
    var msg=document.getElementById('dlgMsg');
    var inp=document.getElementById('dlgInput');
    var err=document.getElementById('dlgErr');
    var ok=document.getElementById('dlgOk');
    var canc=document.getElementById('dlgCanc');
    titulo.innerHTML=opts.titulo||'';
    msg.textContent=opts.msg||'';
    msg.style.display=opts.msg?'block':'none';
    err.style.display='none';
    ok.textContent=opts.okText||'Aceptar';
    if(opts.input){
      inp.style.display='block';
      inp.type=opts.password?'password':'text';
      inp.value=opts.valor||'';
      inp.placeholder=opts.placeholder||'';
    }else{inp.style.display='none';}
    ov.classList.add('open');
    if(opts.input)setTimeout(function(){inp.focus();inp.select();},80);
    function cerrar(){
      ov.classList.remove('open');
      ok.onclick=null;canc.onclick=null;inp.onkeydown=null;ov.onclick=null;
    }
    function aceptar(){
      var val=opts.input?inp.value:true;
      if(opts.validar){
        var e=opts.validar(opts.input?inp.value:'');
        if(e){err.textContent=e;err.style.display='block';return;}
      }
      cerrar();resolve(val);
    }
    function cancelar(){cerrar();resolve(opts.input?null:false);}
    ok.onclick=aceptar;
    canc.onclick=cancelar;
    inp.onkeydown=function(ev){if(ev.key==='Enter')aceptar();if(ev.key==='Escape')cancelar();};
    ov.onclick=function(ev){if(ev.target===ov)cancelar();};
  });
}
function dlgPrompt(titulo,msg,valor,placeholder){return dlgBase({titulo:titulo,msg:msg,input:true,valor:valor,placeholder:placeholder});}
function dlgConfirm(titulo,msg,okText){return dlgBase({titulo:titulo,msg:msg,okText:okText||'Aceptar'});}

function resetAll(){
  dlgBase({
    titulo:'&#x21BA; Limpiar cantidades',
    msg:'Ingresa la contrasena para limpiar todas las cantidades fisicas:',
    input:true,password:true,placeholder:'Contrasena',okText:'Limpiar',
    validar:function(v){if(v!=='001')return 'Contrasena incorrecta.';}
  }).then(function(res){
    if(res===null)return;
    db.fisicos={};saveDB();aplicarFiltros();
    toast('Cantidades fisicas limpiadas');
  });
}
function clearSearch(){document.getElementById('busq').value='';aplicarFiltros();}
function hl(t,q){
  if(!q)return esc(t);
  var i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i===-1)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hora(){var d=new Date();return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}
function setSS(cls,txt){var el=document.getElementById('syncStatus');el.className=cls;el.textContent={ok:'\u25CF ',err:'\u25CF ',busy:'\u25CC '}[cls]+txt;}
function toast(msg,isErr){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='show'+(isErr?' terr':'');
  clearTimeout(toast._t);toast._t=setTimeout(function(){el.className='';},isErr?4000:2200);
}
document.addEventListener('click',function(e){
  if(e.target===document.getElementById('ovNuevo'))cerrarModal('ovNuevo');
  if(e.target===document.getElementById('ovMapa'))cerrarModal('ovMapa');
});
